<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in — BetweenPay</title><link rel="stylesheet" href="commercial.css"></head><body><div class="wrap"><nav class="nav"><a class="brand" href="./"><span class="mark">BP</span><span>Between<b>Pay</b></span></a></nav><div class="card"><div class="kicker">CUSTOMER ACCESS</div><h1>Sign in to BetweenPay.</h1><p class="lead">Enter the email connected to your purchase. We’ll send a secure sign-in link—no password to remember.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><button id="send" class="btn primary" style="width:100%;margin-top:16px">Email me a sign-in link</button><div id="msg" class="notice hidden" style="margin-top:16px"></div><p class="fine" style="margin-top:18px">Haven’t purchased yet? <a href="checkout.html">Get BetweenPay.</a></p></div></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const cfg=BETWEENPAY_CONFIG,msg=document.getElementById("msg"),sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);const preset=new URLSearchParams(location.search).get("email");if(preset)document.getElementById("email").value=preset;document.getElementById("send").onclick=async()=>{const email=document.getElementById("email").value.trim().toLowerCase();if(!email)return;const next=new URLSearchParams(location.search).get("next")||"app/";const redirect=new URL(next,location.href).href;const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirect,shouldCreateUser:true}});msg.classList.remove("hidden");msg.textContent=error?error.message:"Check your email for your secure BetweenPay sign-in link.";};</script></body></html>
