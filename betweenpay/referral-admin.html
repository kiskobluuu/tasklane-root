<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Referral Admin — BetweenPay</title><link rel="stylesheet" href="commercial.css"><style>.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{padding:16px;border:1px solid #dbe7ec;border-radius:16px;background:#f8fbfc}.stat b{display:block;font-size:28px;margin-top:4px}.simrow{display:grid;grid-template-columns:55px 1fr 130px 130px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #e4ecef}.tag{font-size:11px;font-weight:900;border-radius:99px;padding:5px 8px;background:#eaf8f4;color:#087767}.danger{background:#fff1f1!important;color:#9f2734!important;border-color:#f1cfd4!important}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.simrow{grid-template-columns:45px 1fr}.simrow .actions{grid-column:1/-1}}</style></head><body><main class="legal"><a class="brand" href="./"><span class="mark">BP</span><span>Between<b>Pay</b></span></a><h1>Referral Challenge Admin</h1><div id="app"><p>Checking owner access…</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(BETWEENPAY_CONFIG.SUPABASE_URL,BETWEENPAY_CONFIG.SUPABASE_PUBLISHABLE_KEY),app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
async function api(body){const {data:{session}}=await sb.auth.getSession();if(!session){app.innerHTML='<p><a href="login.html">Sign in</a> with the Task Lane owner account.</p>';return null}const r=await fetch(BETWEENPAY_CONFIG.SUPABASE_URL+"/functions/v1/betweenpay-referral-admin",{method:body?"POST":"GET",headers:{"Content-Type":"application/json","apikey":BETWEENPAY_CONFIG.SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+session.access_token},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok){alert(d.error||"Admin action failed");return null}return d}
function fmt(x){return x?new Date(x).toLocaleString():"—"}
async function load(){const d=await api();if(!d)return;const c=d.contest,s=d.stats||{},ended=c.ends_at&&Date.now()>=new Date(c.ends_at).getTime();const demos=(d.simulation||[]).filter(x=>x.is_demo);app.innerHTML=
`<div class="card"><h2>Contest: ${esc((ended&&c.status==="live"?"ENDED — READY TO FINALIZE":c.status).toUpperCase())}</h2><p><strong>Start:</strong> ${fmt(c.starts_at)}<br><strong>End:</strong> ${fmt(c.ends_at)}</p><p class="fine">Launching starts the official 30-day clock immediately. It cannot be reset from this page.</p>${c.status==="draft"?'<button class="btn primary" id="launch">Launch 30-day contest now</button>':""}${c.status==="live"&&ended?'<button class="btn primary" id="close">Finalize contest</button>':""}<p style="margin-top:16px"><a href="contest.html" target="_blank">Open public contest page →</a></p></div>
<div class="stats"><div class="stat">Real entries<b>${s.real_participants||0}</b></div><div class="stat">Rules accepted<b>${s.rules_accepted||0}</b></div><div class="stat">Qualified referrals<b>${s.qualified_referrals||0}</b></div><div class="stat">Demo accounts<b>${s.demo_accounts||0}</b></div></div>
<div class="card"><h2>Live simulation controls</h2><p class="fine">Demo accounts can be used while the contest is live, but are excluded from official rankings and prizes.</p><div class="field"><label>Demo display name</label><input id="name" placeholder="Demo Tester"></div><div class="field"><label>Simulated referral count</label><input id="count" type="number" min="0" value="10"></div><button class="btn primary" id="demo">Add demo account</button>${demos.length?'<hr style="margin:24px 0;border:0;border-top:1px solid #e4ecef"><h3>Existing demos</h3>'+demos.map(x=>`<div class="simrow"><strong>#${x.rank}</strong><span>${esc(x.display_name)} <span class="tag">DEMO</span></span><span>${x.referrals} referrals</span><span class="actions"><button class="btn" data-edit="${x.id}">Edit</button> <button class="btn danger" data-del="${x.id}">Delete</button></span></div>`).join(""):""}</div>
<div class="card"><h2>Simulation leaderboard</h2><p class="fine">This combines real entries with demo accounts so you can test positions without changing the public leaderboard.</p>${(d.simulation||[]).map(x=>`<div class="simrow"><strong>#${x.rank}</strong><span>${esc(x.display_name||x.referral_code)} ${x.is_demo?'<span class="tag">DEMO</span>':x.rules_accepted_at?'<span class="tag">REAL</span>':'<span class="tag">RULES PENDING</span>'}</span><span>${x.referrals} referrals</span><span></span></div>`).join("")||"<p>No participants yet.</p>"}</div>
<div class="card"><h2>Official Top 10 preview</h2><p class="fine">Demo accounts are excluded. This is the ranking that would determine prizes if the contest ended now.</p>${(d.official_preview||[]).map(x=>`<div class="simrow"><strong>#${x.rank}</strong><span>${esc(x.display_name||"Participant")}</span><span>${x.referrals} referrals</span><span></span></div>`).join("")||"<p>No prize-eligible participants yet.</p>"}</div>
${(d.winners||[]).length?`<div class="card"><h2>Final winner verification</h2><p class="fine">These placements were snapshotted when the contest was finalized.</p>${d.winners.map(w=>`<div class="simrow"><strong>#${w.place}</strong><span>${esc(w.display_name)} — ${Number(w.prize_amount).toLocaleString()}</span><span>${w.referral_count} referrals</span><span class="actions"><select data-winner="${w.place}"><option value="pending" ${w.status==="pending"?"selected":""}>Pending</option><option value="verified" ${w.status==="verified"?"selected":""}>Verified</option><option value="paid" ${w.status==="paid"?"selected":""}>Paid</option></select></span></div>`).join("")}</div>`:""}
<div class="card"><h2>Recent admin activity</h2>${(d.logs||[]).map(x=>`<p><strong>${esc(x.action)}</strong> · ${fmt(x.created_at)}</p>`).join("")||"<p>No admin actions logged yet.</p>"}</div>`;
if(document.getElementById("launch"))document.getElementById("launch").onclick=async()=>{if(confirm("Launch the official contest now? This starts the 30-day clock immediately.")){await api({action:"launch"});location.reload()}};
if(document.getElementById("close"))document.getElementById("close").onclick=async()=>{if(confirm("Finalize the contest and freeze its status as closed?")){await api({action:"close"});location.reload()}};
document.getElementById("demo").onclick=async()=>{await api({action:"save_demo",display_name:document.getElementById("name").value,demo_referral_count:Number(document.getElementById("count").value)});location.reload()};
document.querySelectorAll("[data-edit]").forEach(btn=>btn.onclick=async()=>{const row=d.simulation.find(x=>x.id===btn.dataset.edit);const name=prompt("Demo display name",row.display_name||"Demo Account");if(name===null)return;const count=prompt("Simulated referral count",String(row.demo_referral_count||0));if(count===null)return;await api({action:"save_demo",id:row.id,display_name:name,demo_referral_count:Number(count)});location.reload()});
document.querySelectorAll("[data-del]").forEach(btn=>btn.onclick=async()=>{if(confirm("Delete this demo account?")){await api({action:"delete_demo",id:btn.dataset.del});location.reload()}});document.querySelectorAll("[data-winner]").forEach(sel=>sel.onchange=async()=>{await api({action:"winner_status",place:Number(sel.dataset.winner),status:sel.value});location.reload()});
}
load();
</script></body></html>
