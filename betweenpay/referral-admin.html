<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Referral Admin — BetweenPay</title><link rel="stylesheet" href="commercial.css"></head><body><main class="legal"><a class="brand" href="./"><span class="mark">BP</span><span>Between<b>Pay</b></span></a><h1>Referral Challenge Admin</h1><div id="app"><p>Checking owner access…</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(BETWEENPAY_CONFIG.SUPABASE_URL,BETWEENPAY_CONFIG.SUPABASE_PUBLISHABLE_KEY),app=document.getElementById("app");async function api(body){const {data:{session}}=await sb.auth.getSession();if(!session){app.innerHTML='<p><a href="login.html">Sign in</a> with the Task Lane owner account.</p>';return null}const r=await fetch(BETWEENPAY_CONFIG.SUPABASE_URL+"/functions/v1/betweenpay-referral-admin",{method:body?"POST":"GET",headers:{"Content-Type":"application/json","apikey":BETWEENPAY_CONFIG.SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+session.access_token},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok){app.innerHTML="<p>"+d.error+"</p>";return null}return d}
async function load(){const d=await api();if(!d)return;app.innerHTML=`<div class="card"><h2>Contest: ${d.contest.status.toUpperCase()}</h2><p>${d.contest.starts_at?new Date(d.contest.starts_at).toLocaleString():"Not launched"} ${d.contest.ends_at?" — "+new Date(d.contest.ends_at).toLocaleString():""}</p>${d.contest.status==="draft"?'<button class="btn primary" id="launch">Launch 30-day contest now</button>':""}</div><div class="card"><h2>Live simulation controls</h2><p class="fine">Demo accounts appear only in this admin simulation. They are excluded from the official public leaderboard and prizes.</p><div class="field"><label>Demo display name</label><input id="name" placeholder="Demo Tester"></div><div class="field"><label>Simulated referral count</label><input id="count" type="number" min="0" value="10"></div><button class="btn primary" id="demo">Add/update demo account</button></div><div class="card"><h2>Simulation leaderboard</h2><div>${d.simulation.map(x=>`<p><strong>#${x.rank}</strong> — ${x.display_name||x.referral_code} — ${x.referrals} referrals ${x.is_demo?"<em>(DEMO)</em>":""}</p>`).join("")||"<p>No participants yet.</p>"}</div></div>`;if(document.getElementById("launch"))document.getElementById("launch").onclick=async()=>{if(confirm("Start the official 30-day contest now?")){await api({action:"launch"});location.reload()}};document.getElementById("demo").onclick=async()=>{await api({action:"save_demo",display_name:document.getElementById("name").value,demo_referral_count:Number(document.getElementById("count").value)});location.reload()}}
load();
</script></body></html>
