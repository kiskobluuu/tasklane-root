<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Referrals — BetweenPay</title><link rel="stylesheet" href="commercial.css"></head><body><div class="wrap"><nav class="nav"><a class="brand" href="./"><span class="mark">BP</span><span>Between<b>Pay</b></span></a><div class="navlinks"><a href="contest.html">Leaderboard</a><a href="app/">BetweenPay app</a></div></nav><div class="card"><div class="kicker">$10K REFERRAL CHALLENGE</div><h1>My referral dashboard</h1><div id="box"><p>Checking your BetweenPay account…</p></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(BETWEENPAY_CONFIG.SUPABASE_URL,BETWEENPAY_CONFIG.SUPABASE_PUBLISHABLE_KEY);const box=document.getElementById("box");
async function call(method="GET",body){const {data:{session}}=await sb.auth.getSession();if(!session){box.innerHTML='<p>Please <a href="login.html">sign in to BetweenPay</a> first.</p>';return}const r=await fetch(BETWEENPAY_CONFIG.SUPABASE_URL+"/functions/v1/betweenpay-referral-account",{method,headers:{"Content-Type":"application/json","apikey":BETWEENPAY_CONFIG.SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+session.access_token},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok){box.innerHTML="<p>"+(d.error||"Could not load referral account.")+"</p>";return}render(d)}
function render(d){if(!d.joined){box.innerHTML='<p>You are eligible to join because your BetweenPay purchase is active.</p><div class="field"><label>Leaderboard display name</label><input id="dn" maxlength="40" placeholder="Name shown publicly"></div><button class="btn primary" id="join">Join referral challenge</button><p class="fine">The contest begins only when the official contest page shows LIVE NOW.</p>';document.getElementById("join").onclick=()=>call("POST",{display_name:document.getElementById("dn").value});return}box.innerHTML=`<h2>${d.qualified_referrals} qualified referrals</h2><p>Your referral code: <strong>${d.referral_code}</strong></p><div class="field"><label>Your unique referral link</label><input id="link" readonly value="${d.referral_link}"></div><button class="btn primary" id="copy">Copy referral link</button><p style="margin-top:20px"><a href="contest.html">View official leaderboard →</a></p>`;document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(d.referral_link);document.getElementById("copy").textContent="Copied!"}}
call();
</script></body></html>
