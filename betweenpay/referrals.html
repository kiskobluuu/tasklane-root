<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Referrals — BetweenPay</title><link rel="stylesheet" href="commercial.css"><style>.status-pill{display:inline-block;padding:7px 11px;border-radius:99px;background:#eaf8f4;color:#087767;font-weight:800;font-size:12px}.rulesbox{display:flex;gap:10px;align-items:flex-start;margin:16px 0;padding:14px;border:1px solid #dbe7ec;border-radius:14px;background:#f8fbfc}.disclosurebox{margin:14px 0;padding:14px;border:1px solid #d5ebe7;border-radius:14px;background:#f2fbf8;color:#486373;font-size:13px;line-height:1.5}.disclosurebox strong{color:#0b3248}.sharekit{margin-top:18px;padding:18px;border:1px solid #dbe7ec;border-radius:18px;background:#fff}.sharekit h3{margin:0 0 6px}.sharekit p{margin:0 0 12px;color:#657b89;font-size:13px;line-height:1.5}.sharebuttons{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.sharebuttons button,.sharebuttons a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid #cfe1e6;background:#f7fbfc;color:#0b3248;text-decoration:none;font-weight:850;font-size:13px;cursor:pointer}.caption{width:100%;min-height:128px;resize:vertical;margin-top:10px;padding:12px;border:1px solid #dbe7ec;border-radius:12px;font:inherit;line-height:1.45;color:#294654}@media(max-width:560px){.sharebuttons{grid-template-columns:1fr}}.rulesbox input{margin-top:4px}.statbox{padding:16px;border:1px solid #dbe7ec;border-radius:16px;margin:18px 0;background:#f8fbfc}</style></head><body><div class="wrap"><nav class="nav"><a class="brand" href="./"><span class="mark">BP</span><span>Between<b>Pay</b></span></a><div class="navlinks"><a href="contest.html">Leaderboard</a><a href="app/">BetweenPay app</a></div></nav><div class="card"><div class="kicker">$10K REFERRAL CHALLENGE</div><h1>My referral dashboard</h1><div id="box"><p>Checking your BetweenPay account…</p></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="tracker.js"></script><script>
const sb=supabase.createClient(BETWEENPAY_CONFIG.SUPABASE_URL,BETWEENPAY_CONFIG.SUPABASE_PUBLISHABLE_KEY),box=document.getElementById("box");
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
async function call(method="GET",body){const {data:{session}}=await sb.auth.getSession();if(!session){box.innerHTML='<p>Please <a href="login.html">sign in to BetweenPay</a> first.</p>';return}const res=await fetch(BETWEENPAY_CONFIG.SUPABASE_URL+"/functions/v1/betweenpay-referral-account",{method,headers:{"Content-Type":"application/json","apikey":BETWEENPAY_CONFIG.SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+session.access_token},body:body?JSON.stringify(body):undefined});const d=await res.json();if(!res.ok){box.innerHTML='<p class="notice">'+esc(d.error||"Could not load referral account.")+'</p>';return}render(d)}
function rulesBlock(){return '<label class="rulesbox"><input id="acceptRules" type="checkbox"><span><strong>I confirm I am 18+ and legally eligible to participate where I live, and I agree to the <a href="contest-rules.html" target="_blank">Official Contest Rules</a>.</strong><br><span class="fine">The challenge starts only when the official contest page shows LIVE NOW.</span></span></label>'}
function render(d){
 const status=d.contest?.status==="live"?"LIVE NOW":d.contest?.status==="closed"?"CLOSED":"COMING SOON";
 const statusHtml='<p><span class="status-pill">'+status+'</span></p>';
 if(!d.joined){
   box.innerHTML=statusHtml+'<p>You are eligible to join because your BetweenPay purchase is active.</p><div class="field"><label>Leaderboard display name</label><input id="dn" maxlength="40" placeholder="Name shown publicly"></div>'+rulesBlock()+'<button class="btn primary" id="join">Join referral challenge</button>';
   document.getElementById("join").onclick=async()=>{const name=document.getElementById("dn").value.trim();const accepted=document.getElementById("acceptRules").checked;if(!name){alert("Enter a leaderboard display name.");return}if(!accepted){alert("Accept the Official Contest Rules to join.");return}await call("POST",{display_name:name,accept_rules:true});bpTrack("referral_join");};
   return;
 }
 if(!d.rules_accepted){
   box.innerHTML=statusHtml+'<p>Your referral entry was created during testing. Accept the current Official Contest Rules to activate it before launch.</p>'+rulesBlock()+'<button class="btn primary" id="activate">Accept rules & activate entry</button>';
   document.getElementById("activate").onclick=async()=>{if(!document.getElementById("acceptRules").checked){alert("Accept the Official Contest Rules to continue.");return}await call("POST",{accept_rules:true});bpTrack("referral_join",{existing_entry:true});};
   return;
 }
 const adminNote=""; const dates=d.contest?.starts_at&&d.contest?.ends_at?'<p class="fine">Contest period: '+new Date(d.contest.starts_at).toLocaleString()+' — '+new Date(d.contest.ends_at).toLocaleString()+'</p>':'<p class="fine">The official 30-day clock has not started yet.</p>';
 box.innerHTML=statusHtml+adminNote+dates+'<div class="statbox"><h2 style="margin:0">'+Number(d.qualified_referrals||0)+' qualified referrals</h2><p class="fine" style="margin-bottom:0">Only verified qualifying purchases during the live contest period count.</p></div><p>Your referral code: <strong>'+esc(d.referral_code)+'</strong></p><div class="field"><label>Your unique referral link</label><input id="link" readonly value="'+esc(d.referral_link)+'"></div><button class="btn primary" id="copy">Copy referral link</button><div class="disclosurebox"><strong>When you share your referral link:</strong> clearly tell people you are participating in the BetweenPay cash-prize referral challenge and may benefit if they purchase through your link. Keep the disclosure with the post or message itself.</div><div class="sharekit"><h3>Ready-to-share promotion kit</h3><p>Use this clear version so people immediately understand both BetweenPay and the live cash-prize challenge.</p><textarea id="shareCaption" class="caption" readonly></textarea><div class="sharebuttons"><button id="copyCaption">Copy full post</button><button id="nativeShare">Share from phone</button><a id="waShare" target="_blank" rel="noopener">Share on WhatsApp</a><a id="xShare" target="_blank" rel="noopener">Share on X</a><a id="fbShare" target="_blank" rel="noopener">Share on Facebook</a><a id="emailShare">Share by email</a></div></div><p style="margin-top:20px"><a href="contest.html">View official leaderboard →</a> &nbsp;·&nbsp; <a href="contest-rules.html">Official rules</a></p>';
 const caption='BetweenPay’s official $10,000 Referral Challenge is LIVE. BetweenPay is a $12.99 one-time Safe-to-Spend planner that helps protect bills, goals and a safety buffer before showing what is available to spend. I’m participating in the cash-prize referral challenge and may benefit if you purchase through my referral link. See the live countdown, leaderboard and rules here: '+d.referral_link;
 document.getElementById("shareCaption").value=caption;
 const enc=encodeURIComponent(caption),linkEnc=encodeURIComponent(d.referral_link);
 document.getElementById("waShare").href='https://wa.me/?text='+enc;
 document.getElementById("xShare").href='https://twitter.com/intent/tweet?text='+enc;
 document.getElementById("fbShare").href='https://www.facebook.com/sharer/sharer.php?u='+linkEnc;
 document.getElementById("emailShare").href='mailto:?subject='+encodeURIComponent('BetweenPay $10,000 Referral Challenge')+'&body='+enc;
 document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(d.referral_link);document.getElementById("copy").textContent="Copied!";bpTrack("referral_link_copy",{referral_code:d.referral_code});};
 document.getElementById("copyCaption").onclick=async()=>{await navigator.clipboard.writeText(caption);document.getElementById("copyCaption").textContent="Copied!";bpTrack("referral_share",{channel:"copy_post",referral_code:d.referral_code});};
 document.getElementById("nativeShare").onclick=async()=>{try{if(navigator.share){await navigator.share({title:"BetweenPay $10,000 Referral Challenge",text:caption,url:d.referral_link});bpTrack("referral_share",{channel:"native",referral_code:d.referral_code});}else{await navigator.clipboard.writeText(caption);document.getElementById("nativeShare").textContent="Post copied";}}catch(_){}};
 [["waShare","whatsapp"],["xShare","x"],["fbShare","facebook"],["emailShare","email"]].forEach(([id,channel])=>document.getElementById(id)?.addEventListener("click",()=>bpTrack("referral_share",{channel,referral_code:d.referral_code})));
}
call();
</script><script src="support-chat.js"></script>
</body></html>
