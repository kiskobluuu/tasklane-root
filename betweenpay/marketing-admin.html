<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Marketing Automation — BetweenPay</title><link rel="stylesheet" href="commercial.css">
<style>
body{background:#f3f7f9}.shell{max-width:1450px;margin:auto;padding:20px 22px 70px}.nav2{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.links{display:flex;gap:12px;flex-wrap:wrap}.links a{text-decoration:none;font-weight:800}
.hero{background:linear-gradient(135deg,#071f33,#0d5962);color:white;border-radius:28px;padding:28px 30px;display:flex;justify-content:space-between;gap:24px;align-items:center}.hero h1{font-size:44px;margin:5px 0 8px;letter-spacing:-.04em}.hero p{color:#cbe0e3;margin:0}.badge{background:#daf8ef;color:#087467;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{background:#fff;border:1px solid #dce7ec;border-radius:18px;padding:17px}.stat span{font-size:10px;font-weight:900;color:#708692;text-transform:uppercase}.stat b{display:block;font-size:26px;margin-top:5px}.stat small{color:#81939d}
.panel{background:#fff;border:1px solid #dce7ec;border-radius:24px;padding:22px;margin-top:16px}.panel-head{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:15px}.panel h2{margin:0}.panel p{margin:4px 0 0;color:#708591;font-size:13px}
.table-wrap{overflow:auto;border:1px solid #e0e9ed;border-radius:17px}.table{width:100%;min-width:900px;border-collapse:collapse}.table th{background:#f5faf9;padding:10px;text-align:left;font-size:10px;text-transform:uppercase;color:#687f8b}.table td{padding:11px 10px;border-top:1px solid #edf2f4;font-size:12px}.good{color:#087767;font-weight:900}.bad{color:#a12b38;font-weight:900}.qstatus{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;text-transform:uppercase}.q-ready{background:#eaf8f4;color:#087767}.q-posted{background:#e8f0ff;color:#325d9b}.q-paused{background:#fff6d9;color:#946a00}.q-pending_review{background:#fff0dc;color:#9a5a00}.q-skipped{background:#f1f3f5;color:#667784}.queue-actions{display:flex;gap:6px;flex-wrap:wrap}.queue-actions button{border:1px solid #d7e3e8;background:#fff;border-radius:8px;padding:5px 7px;font-size:10px;font-weight:800;cursor:pointer}.queue-url{max-width:260px;word-break:break-all;color:#456775}.draftbox{max-width:420px;white-space:pre-wrap;line-height:1.45;color:#506b78}.draftbox details summary{cursor:pointer;font-weight:850;color:#0b5660}.draftbox .instructions{margin-top:8px;padding-top:8px;border-top:1px solid #e4ecef;font-size:11px;color:#718591}
.builder{display:grid;grid-template-columns:1fr 1fr;gap:12px}.builder .full{grid-column:1/-1}.copyrow{display:flex;gap:8px}.copyrow input{flex:1}.contest-panel{background:linear-gradient(135deg,#071f33,#0c4f5c);color:#fff;border:0}.contest-panel p{color:#cbe0e3}.contest-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.contest-stat{background:#ffffff10;border:1px solid #ffffff1b;border-radius:15px;padding:14px}.contest-stat span{display:block;font-size:10px;letter-spacing:.07em;color:#a9d4d3;text-transform:uppercase;font-weight:900}.contest-stat b{display:block;font-size:24px;margin-top:5px}.contest-note{margin-top:12px;font-size:12px;color:#bcd3d8}.playbook-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.playcard{border:1px solid #dce7ec;border-radius:18px;padding:18px;background:#fbfefe}.playcard.active{border-color:#9bd9cf;background:#effaf7}.playcard .phase{font-size:10px;letter-spacing:.1em;font-weight:950;color:#087767;text-transform:uppercase}.playcard h3{margin:7px 0 6px}.playcard p{font-size:12.5px;line-height:1.55;color:#617884}.playcard ul{margin:10px 0 0;padding-left:18px;color:#506b78;font-size:12px;line-height:1.55}.copybank{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.copyitem{border:1px solid #dce7ec;border-radius:16px;padding:14px;background:#fff}.copyitem strong{display:block;margin-bottom:5px}.copyitem p{font-size:12px;line-height:1.45;color:#617884;margin:0 0 10px}.copyitem .btn{width:100%;padding:9px 12px}.decision{margin-top:14px;padding:14px 16px;border-radius:16px;background:#f5faf9;border:1px solid #dce7ec;font-size:12px;line-height:1.55;color:#4f6b77}.decision b{color:#0b3248}@media(max-width:900px){.contest-stats{grid-template-columns:1fr 1fr}.playbook-grid,.copybank{grid-template-columns:1fr}}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.hero{align-items:flex-start;flex-direction:column}}@media(max-width:620px){.shell{padding:14px}.stats{grid-template-columns:1fr 1fr}.builder{grid-template-columns:1fr}.builder .full{grid-column:auto}.hero h1{font-size:36px}.panel{padding:15px}}
</style></head>
<body><div class="shell">
<div class="nav2"><a class="brand" href="./"><span class="mark">BP</span><span>Between<b>Pay</b></span></a><div class="links"><a href="sales-admin.html">Sales</a><a href="referral-admin.html">Referral admin</a><a href="./">Home</a><a href="admin-login.html?next=marketing-admin.html">Switch admin</a></div></div>
<div id="app"><div class="panel"><p>Checking owner access…</p></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(BETWEENPAY_CONFIG.SUPABASE_URL,BETWEENPAY_CONFIG.SUPABASE_PUBLISHABLE_KEY),app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n||0));
async function api(body){
 const {data:{session}}=await sb.auth.getSession();if(!session){location.replace("admin-login.html?next=marketing-admin.html");return null}
 const r=await fetch(BETWEENPAY_CONFIG.SUPABASE_URL+"/functions/v1/betweenpay-marketing-admin",{
   method:body?"POST":"GET",
   headers:{"Content-Type":"application/json","apikey":BETWEENPAY_CONFIG.SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+session.access_token},
   body:body?JSON.stringify(body):undefined
 });
 const d=await r.json();if(!r.ok){if(r.status===401||r.status===403){location.replace("admin-login.html?next=marketing-admin.html");return null}throw new Error(d.error||"Request failed")}
 return d
}
async function load(){
 try{const d=await api();if(d)render(d)}
 catch(e){app.innerHTML='<div class="panel"><h2>Could not load marketing dashboard</h2><p>'+esc(e.message||"Request failed")+'</p></div>'}
}
function phaseFor(c){
 const d=Number(c.days_remaining||0);
 if(d<=2)return {key:"final48",label:"Final 48 hours",title:"Urgency without hype",focus:"Countdown, verified leaderboard, rules, and one clear purchase/join path.",actions:["Post the exact time remaining, not vague urgency.","Lead with the $10,000 first prize + $12,050 total pool, then explain the $12.99 product.","Push active participants to reshare their disclosed referral post.","Do not change the rules, prize pool or scoring during the close."]};
 if(d<=7)return {key:"finalweek",label:"Final week",title:"Make the live clock visible everywhere",focus:"Turn existing awareness into action before the deadline.",actions:["Use leaderboard movement and days remaining as social proof.","Retarget organic visitors through email nurture and abandoned-checkout recovery.","Feature the free calculator for people still unsure about the product.","Encourage participants to share again with the built-in promotion kit."]};
 if(d<=14)return {key:"midlate",label:"Days 14–8",title:"Proof + urgency",focus:"Show that the contest is active and the product has standalone value.",actions:["Share real participant/referral milestones when they exist.","Alternate contest-first and product-first posts.","Keep the live leaderboard and Official Rules in every contest-heavy campaign.","Use source tracking to stop repeating channels that create visits but no checkout starts."]};
 if(d<=23)return {key:"middle",label:"Days 23–15",title:"Education + repetition",focus:"Explain BetweenPay clearly enough that prize-driven traffic still understands the purchase.",actions:["Demonstrate Safe-to-Spend with simple examples.","Send cold traffic to the free calculator when direct contest traffic hesitates.","Use participant sharing as the lowest-cost customer-acquisition loop.","Turn frequently asked questions into short social posts."]};
 return {key:"launch",label:"Days 30–24",title:"Launch credibility",focus:"Make the $10,000 claim look immediately real, official and understandable.",actions:["Lead with LIVE NOW + exact prize structure + 30-day clock.","Pair every contest post with product value: $12.99 once, no subscription, no bank connection.","Point skeptical visitors to the live leaderboard and Official Rules.","Use the free calculator as the low-friction second path."]};
}
function playbookPanel(c){
 const p=phaseFor(c);
 const views=Number(c.contest_views||0), clicks=Number(c.contest_checkout_clicks||0), parts=Number(c.active_participants||0), refs=Number(c.qualified_referrals||0);
 const clickRate=views?Math.round(clicks/views*1000)/10:0;
 const shareRate=parts?Math.round(Number(c.referral_shares||0)/parts*100)/100:0;
 return '<section class="panel"><div class="panel-head"><div><div class="kicker">30-DAY OPERATING PLAYBOOK</div><h2>'+esc(p.label)+' · '+esc(p.title)+'</h2><p>'+esc(p.focus)+'</p></div><span class="badge">'+Number(c.days_remaining||0)+' days left</span></div>'+
 '<div class="playbook-grid"><div class="playcard active"><div class="phase">CURRENT FOCUS</div><h3>'+esc(p.title)+'</h3><ul>'+p.actions.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>'+
 '<div class="playcard"><div class="phase">LIVE DECISION SIGNALS</div><h3>What the funnel is saying</h3><p>Contest → checkout click rate: <strong>'+clickRate+'%</strong><br>Active participants: <strong>'+parts+'</strong><br>Qualified referrals: <strong>'+refs+'</strong><br>Tracked shares per participant: <strong>'+shareRate+'</strong></p><div class="decision">'+
 (views>=20&&clickRate<8?'<b>Priority:</b> traffic is reaching the contest but not moving to checkout. Strengthen product value and the purchase/join CTA before buying ads.':
  clicks>=10&&Number(c.referred_sales||0)===0?'<b>Priority:</b> people are clicking toward purchase but referred sales are not appearing yet. Watch checkout conversion and payment completion before increasing traffic.':
  parts>=3&&Number(c.referral_shares||0)<parts?'<b>Priority:</b> participants are joining faster than they are sharing. Push the built-in referral promotion kit.':
  '<b>Priority:</b> keep collecting clean traffic data. Do not pay to scale a channel until it produces checkout starts or sales.')+
 '</div></div></div>'+
 '<div class="copybank">'+
 '<div class="copyitem"><strong>Contest-first launch</strong><p>LIVE NOW: BetweenPay’s official 30-day Referral Challenge has a $10,000 first-place cash prize and $12,050 total prize pool. Verified purchases only, live leaderboard, published rules. BetweenPay itself is $12.99 once.</p><button class="btn preset" data-dest="contest" data-campaign="live_10k" data-content="contest_first">Use this campaign</button></div>'+
 '<div class="copyitem"><strong>Product-first</strong><p>Your bank balance is not always the same as what is safe to spend before payday. BetweenPay protects bills, goals and a buffer first, then shows one Safe-to-Spend number. $12.99 once.</p><button class="btn preset" data-dest="home" data-campaign="safe_to_spend" data-content="product_first">Use this campaign</button></div>'+
 '<div class="copyitem"><strong>Free-calculator hook</strong><p>Not ready to buy anything? Run the free 60-second Safe-to-Spend check first. No account and no bank connection required.</p><button class="btn preset" data-dest="calculator" data-campaign="free_calculator" data-content="calculator_hook">Use this campaign</button></div>'+
 '<div class="copyitem"><strong>Leaderboard proof</strong><p>The $10K Referral Challenge is active now. Check the live countdown, verified leaderboard and Official Rules before deciding whether to participate.</p><button class="btn preset" data-dest="contest" data-campaign="leaderboard_proof" data-content="proof">Use this campaign</button></div>'+
 '<div class="copyitem"><strong>Final-week angle</strong><p>The official BetweenPay $10K Referral Challenge is in its final week. See the exact time remaining, live standings, prize structure and rules on the official contest page.</p><button class="btn preset" data-dest="contest" data-campaign="final_week" data-content="countdown">Use this campaign</button></div>'+
 '<div class="copyitem"><strong>Participant growth loop</strong><p>Existing contestants should use My Referrals → Ready-to-share promotion kit. Every channel click is tracked so Growth Watch can show which sharing methods actually create customers.</p><button class="btn preset" data-dest="contest" data-campaign="participant_loop" data-content="referral_share">Use this campaign</button></div>'+
 '</div></section>';
}
function render(d){
 const f=d.funnel||{},e=d.email||{},c=d.contest||{},sources=d.sources||[],acq=d.acquisition_queue||[];
 const contestStatus=c.status==="live"?"LIVE NOW":c.status==="closed"?"CLOSED":"DRAFT";
 app.innerHTML=
 '<section class="hero"><div><div class="kicker" style="color:#8ff0d6">AUTOMATED GROWTH</div><h1>Marketing Automation</h1><p>30-day attribution, lead capture, email nurture and checkout recovery.</p></div><span class="badge">15-minute automation cycle active</span></section>'+
 '<div class="stats">'+
 '<div class="stat"><span>Landing sessions</span><b>'+f.landing_sessions+'</b><small>Last 30 days</small></div>'+
 '<div class="stat"><span>Leads captured</span><b>'+f.lead_captures+'</b><small>'+e.active_leads+' active nurture leads</small></div>'+
 '<div class="stat"><span>Checkout starts</span><b>'+f.checkout_starts+'</b><small>'+f.checkout_to_sale+'% checkout→sale</small></div>'+
 '<div class="stat"><span>Sales / revenue</span><b>'+f.sales+' · '+money(f.revenue)+'</b><small>'+f.landing_to_sale+'% landing→sale</small></div>'+
 '<div class="stat"><span>Free calculator</span><b>'+f.calculator_sessions+'</b><small>'+f.calculator_results+' completed estimates</small></div>'+
 '<div class="stat"><span>Emails sent</span><b>'+e.emails_sent+'</b><small>'+e.emails_queued+' queued</small></div>'+
 '<div class="stat"><span>Recovery emails</span><b>'+e.recovery_sent+'</b><small>Opt-in abandoned checkout</small></div>'+
 '<div class="stat"><span>Email health</span><b class="'+(e.emails_failed?'bad':'good')+'">'+(e.emails_failed?e.emails_failed+' failed':'All clear')+'</b><small>'+e.unsubscribed+' unsubscribed</small></div>'+
 '</div>'+
 '<section class="panel contest-panel"><div class="panel-head"><div><div class="kicker" style="color:#8ff0d6">LIVE CONTEST GROWTH WATCH</div><h2>$10,000 Referral Challenge · '+contestStatus+'</h2><p>Tracks the active contest as an acquisition channel and a customer-driven referral loop.</p></div><span class="badge">'+(c.days_remaining||0)+' days remaining</span></div>'+
 '<div class="contest-stats">'+
 '<div class="contest-stat"><span>Contest views</span><b>'+(c.contest_views||0)+'</b></div>'+
 '<div class="contest-stat"><span>Contest leads</span><b>'+(c.contest_leads||0)+'</b></div>'+
 '<div class="contest-stat"><span>Contest → checkout clicks</span><b>'+(c.contest_checkout_clicks||0)+'</b></div>'+
 '<div class="contest-stat"><span>Active participants</span><b>'+(c.active_participants||0)+'</b></div>'+
 '<div class="contest-stat"><span>Qualified referrals</span><b>'+(c.qualified_referrals||0)+'</b></div>'+
 '<div class="contest-stat"><span>Referral shares</span><b>'+(c.referral_shares||0)+'</b></div>'+
 '<div class="contest-stat"><span>Referred sales</span><b>'+(c.referred_sales||0)+'</b></div>'+
 '<div class="contest-stat"><span>Total entrants</span><b>'+(c.entrants||0)+'</b></div>'+
 '</div>'+
 '<div class="contest-note">Share activity by channel: '+((c.share_channels||[]).length?(c.share_channels||[]).map(x=>esc(x.channel)+': '+x.count).join(' · '):'No participant shares tracked yet.')+'</div></section>'+playbookPanel(c)+
 '<section class="panel"><div class="panel-head"><div><div class="kicker">FREE / ORGANIC TRAFFIC QUEUE</div><h2>Acquisition Queue</h2><p>Track the channels we are actively using before paid ads. Copy the pre-tagged link, publish it in a rule-compliant placement, then mark it posted.</p></div><span class="badge">'+acq.filter(x=>x.status==="ready").length+' ready</span></div>'+
 (acq.length?'<div class="table-wrap"><table class="table"><thead><tr><th>Priority</th><th>Channel</th><th>Placement</th><th>Status</th><th>Post draft</th><th>Trackable URL</th><th>Actions</th></tr></thead><tbody>'+acq.map(x=>{const u=new URL(x.destination);u.searchParams.set("utm_source",x.source);u.searchParams.set("utm_medium",x.medium);u.searchParams.set("utm_campaign",x.campaign);u.searchParams.set("utm_content",x.content);const finalCopy=String(x.post_copy||"").replaceAll("[TRACKED LINK]",u.toString());return '<tr><td><strong>'+x.priority+'</strong></td><td><strong>'+esc(x.channel)+'</strong></td><td>'+esc(x.placement)+'</td><td><span class="qstatus q-'+esc(x.status)+'">'+esc(x.status)+'</span></td><td><div class="draftbox"><details><summary>View draft & instructions</summary><div style="margin-top:8px">'+esc(finalCopy)+'</div><div class="instructions"><strong>Posting notes:</strong><br>'+esc(x.instructions||x.notes||"")+'</div></details></div></td><td><div class="queue-url">'+esc(u.toString())+'</div></td><td><div class="queue-actions"><button data-copy-post="'+x.id+'">Copy post</button><button data-copy-url="'+esc(u.toString())+'">Copy URL</button><button data-qid="'+x.id+'" data-status="pending_review">Pending</button><button data-qid="'+x.id+'" data-status="posted">Posted</button><button data-qid="'+x.id+'" data-status="ready">Ready</button><button data-qid="'+x.id+'" data-status="paused">Pause</button><button data-qid="'+x.id+'" data-status="skipped">Skip</button></div></td></tr>'}).join("")+'</tbody></table></div>':'<p>No acquisition channels configured.</p>')+
 '</section>'+
 '<section class="panel"><div class="panel-head"><div><h2>Source performance</h2><p>Shows which links and channels create visits, leads, checkouts and sales.</p></div></div>'+
 (sources.length?'<div class="table-wrap"><table class="table"><thead><tr><th>Source</th><th>Medium</th><th>Campaign</th><th>Sessions</th><th>Leads</th><th>Checkout starts</th><th>Sales</th><th>Revenue</th><th>Conversion</th></tr></thead><tbody>'+sources.map(x=>'<tr><td><strong>'+esc(x.source)+'</strong></td><td>'+esc(x.medium)+'</td><td>'+esc(x.campaign)+'</td><td>'+x.sessions+'</td><td>'+x.leads+'</td><td>'+x.checkout_starts+'</td><td>'+x.sales+'</td><td>'+money(x.revenue)+'</td><td>'+x.conversion+'%</td></tr>').join("")+'</tbody></table></div>':'<p>No tracked traffic yet.</p>')+
 '</section>'+
 '<section class="panel"><div class="panel-head"><div><h2>Campaign link builder</h2><p>Create trackable links for free posts, directories, communities, emails or future $2/day tests.</p></div></div><div class="builder">'+
 '<div class="field"><label>Destination</label><select id="dest"><option value="https://betweenpay.tasklaneco.com/">Homepage</option><option value="https://betweenpay.tasklaneco.com/contest.html">Live $10K contest</option><option value="https://betweenpay.tasklaneco.com/free-calculator.html">Free calculator</option><option value="https://betweenpay.tasklaneco.com/checkout.html">Checkout</option></select></div>'+
 '<div class="field"><label>Source</label><input id="src" placeholder="reddit, facebook, newsletter"></div>'+
 '<div class="field"><label>Medium</label><input id="med" placeholder="organic, social, email"></div>'+
 '<div class="field"><label>Campaign</label><input id="camp" placeholder="payday_help_oct"></div>'+
 '<div class="field full"><label>Content / variation</label><input id="cont" placeholder="post_a, bio_link, comment_helpful"></div>'+
 '<div class="field full"><label>Trackable URL</label><div class="copyrow"><input id="out" readonly><button class="btn" id="copy">Copy</button></div></div></div></section>';
 ["dest","src","med","camp","cont"].forEach(id=>document.getElementById(id).addEventListener("input",build));
 document.getElementById("copy").onclick=()=>navigator.clipboard.writeText(document.getElementById("out").value);
 const destMap={home:"https://betweenpay.tasklaneco.com/",contest:"https://betweenpay.tasklaneco.com/contest.html",calculator:"https://betweenpay.tasklaneco.com/free-calculator.html",checkout:"https://betweenpay.tasklaneco.com/checkout.html"};
 document.querySelectorAll(".preset").forEach(b=>b.onclick=()=>{
   document.getElementById("dest").value=destMap[b.dataset.dest]||destMap.contest;
   document.getElementById("camp").value=b.dataset.campaign||"live_growth";
   document.getElementById("cont").value=b.dataset.content||"post";
   if(!document.getElementById("med").value)document.getElementById("med").value="organic";
   document.getElementById("src").focus(); build();
   document.getElementById("out").scrollIntoView({behavior:"smooth",block:"center"});
 });
 document.querySelectorAll("[data-copy-post]").forEach(b=>b.onclick=async()=>{
   const x=acq.find(v=>String(v.id)===String(b.dataset.copyPost));if(!x)return;
   const u=new URL(x.destination);u.searchParams.set("utm_source",x.source);u.searchParams.set("utm_medium",x.medium);u.searchParams.set("utm_campaign",x.campaign);u.searchParams.set("utm_content",x.content);
   const copy=String(x.post_copy||"").replaceAll("[TRACKED LINK]",u.toString());
   await navigator.clipboard.writeText(copy);b.textContent="Copied!";
 });
 document.querySelectorAll("[data-copy-url]").forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.copyUrl);b.textContent="Copied!"});
 document.querySelectorAll("[data-qid]").forEach(b=>b.onclick=async()=>{
   const old=b.textContent;b.disabled=true;b.textContent="Saving…";
   try{await api({action:"set_acquisition_status",id:Number(b.dataset.qid),status:b.dataset.status});await load()}
   catch(e){alert(e.message||"Could not update queue");b.disabled=false;b.textContent=old}
 });
 build()
}
function build(){const base=document.getElementById("dest").value,u=new URL(base),m={utm_source:"src",utm_medium:"med",utm_campaign:"camp",utm_content:"cont"};Object.entries(m).forEach(([k,id])=>{const v=document.getElementById(id).value.trim();if(v)u.searchParams.set(k,v)});document.getElementById("out").value=u.toString()}
load();
</script></body></html>
