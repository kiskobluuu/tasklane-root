<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Unsubscribe — BetweenPay</title><link rel="stylesheet" href="commercial.css"></head><body><div class="wrap"><nav class="nav"><a class="brand" href="./"><span class="mark">BP</span><span>Between<b>Pay</b></span></a></nav><main style="max-width:620px;margin:70px auto"><section class="card"><div class="kicker">EMAIL PREFERENCES</div><h1 style="font-size:40px">Unsubscribe from BetweenPay emails.</h1><p id="copy">Confirm below to stop marketing and checkout-reminder emails. Transactional account-access and support emails may still be sent when necessary.</p><button id="btn" class="btn primary">Unsubscribe me</button><div id="msg" class="notice hidden" style="margin-top:16px"></div></section></main></div><script src="config.js"></script><script>
const token=new URLSearchParams(location.search).get("t")||"",btn=document.getElementById("btn"),msg=document.getElementById("msg");
btn.onclick=async()=>{if(!token){msg.textContent="This unsubscribe link is invalid.";msg.classList.remove("hidden");return}btn.disabled=true;btn.textContent="Updating…";try{const r=await fetch(BETWEENPAY_CONFIG.SUPABASE_URL+"/functions/v1/betweenpay-unsubscribe",{method:"POST",headers:{"Content-Type":"application/json","apikey":BETWEENPAY_CONFIG.SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({token})});const j=await r.json();if(!r.ok)throw new Error(j.error||"Could not unsubscribe.");msg.textContent="You have been unsubscribed from BetweenPay marketing and checkout-reminder emails.";msg.classList.remove("hidden");btn.style.display="none"}catch(e){msg.textContent=e.message||"Could not unsubscribe.";msg.classList.remove("hidden");btn.disabled=false;btn.textContent="Unsubscribe me"}};
</script></body></html>
