name: Build BetweenPay Sales OS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'betweenpay-sales-os/**'
      - '.github/workflows/build-betweenpay-sales-os.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: betweenpay-sales-os
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: betweenpay-sales-os/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name BetweenPaySalesOS
          --collect-all keyring
          app.py

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\BetweenPaySalesOS.exe package\BetweenPaySalesOS.exe
          Copy-Item README.md package\README.md
          Compress-Archive -Path package\* -DestinationPath BetweenPaySalesOS-Windows.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BetweenPaySalesOS-Windows
          path: betweenpay-sales-os/BetweenPaySalesOS-Windows.zip
          if-no-files-found: error
          retention-days: 30
